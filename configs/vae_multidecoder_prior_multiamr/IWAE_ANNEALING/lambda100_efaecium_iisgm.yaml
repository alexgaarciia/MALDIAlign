experiment:
  name: iwae_multidecoder_prior_multiamr
  seed: 42
  output_dir: experiments/results

data:
  pkl_path: /export/usuarios01/agnavarr/MALDIAlign/amr_global_final_v3.pkl
  domains: ["DRIAMS_A", "DRIAMS_B", "DRIAMS_C", "MARISMA"]
  species_list: ["Enterococcus_Faecium"]
  antibiotics_filter: ["Vancomycin"]
  normalization: row_minmax
  test_size: 0.2
  batch_size: 256
  use_species_weights: False

model:
  type: iwae
  latent_dim: 128
  num_domains: 4
  n_species: 1
  n_antibiotics: 1
  n_iwae_samples: 5

training:
  epochs: 200
  annealing_epochs: 50
  lr: 1e-4
  lambda_amr: 100
  patience: 30
  metrics_plot_title: "IWAE Multidecoder w/prior for species + AMR"

evaluation:
  use_domain: false
  compute_tsne: true
