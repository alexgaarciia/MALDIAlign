experiment:
  name: vae_multidecoder_prior_multiamr
  seed: 42
  output_dir: experiments/results

data:
  pkl_path: /export/usuarios01/agnavarr/MALDIAlign/amr_global_final.pkl
  domains: ["DRIAMS_A", "DRIAMS_B", "DRIAMS_C", "DRIAMS_D", "MARISMA", "MS-UMG"]
  antibiotics_filter: ["Amikacin", "Ceftazidime", "Ceftriaxone", "Clindamycin", "Erythromycin", "Meropenem", "Piperacillin-Tazobactam", "Tetracycline", "Vancomycin"]
  normalization: row_minmax
  test_size: 0.2
  batch_size: 256
  use_species_weights: False

model:
  type: vae_multidecoder_prior_amr_head
  latent_dim: 128
  num_domains: 6
  n_species: 6
  n_antibiotics: 9

training:
  epochs: 200
  annealing_epochs: 50
  lr: 1e-4
  lambda_amr: 100
  patience: 30
  metrics_plot_title: "VAE Multidecoder w/prior for species + AMR"

evaluation:
  use_domain: false
  compute_tsne: true
