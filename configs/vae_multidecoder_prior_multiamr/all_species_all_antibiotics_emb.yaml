experiment:
  name: vae_multidecoder_prior_multiamr_all_species_all_abs
  seed: 42
  output_dir: experiments/results

data:
  pkl_path: /export/usuarios01/agnavarr/MALDIAlign/amr_global_final_v3.pkl
  domains: ["DRIAMS_A", "DRIAMS_B", "DRIAMS_C", "MARISMA"]
  species_list: ["Klebsiella_Pneumoniae", "Escherichia_Coli", "Staphylococcus_Aureus", "Pseudomonas_Aeruginosa", "Enterococcus_Faecium", "Enterobacter_cloacae_complex"]
  antibiotics_filter: ["Imipenem", "Meropenem", "Ceftazidime", "Ciprofloxacin", "Piperacillin-Tazobactam", "Amikacin", "Oxacillin", "Clindamycin", "Erythromycin", "Vancomycin"]
  normalization: row_minmax
  test_size: 0.2
  batch_size: 256
  use_species_weights: False

model:
  type: vae_multidecoder_prior_amr_head_zemb
  latent_dim: 128
  num_domains: 4
  n_species: 6
  n_antibiotics: 10
  species_emb_dim: 30

training:
  epochs: 200
  lr: 1e-4
  lambda_amr: 100
  patience: 30
  metrics_plot_title: "VAE Multidecoder w/prior for all species + AMR"

evaluation:
  use_domain: false
  compute_tsne: false