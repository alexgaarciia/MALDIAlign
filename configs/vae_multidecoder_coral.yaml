experiment:
  name: vae_multidecoder_coral
  seed: 42
  output_dir: experiments/results

data:
  domains: ["DRIAMS_A", "DRIAMS_D"]
  normalization: row_minmax
  test_size: 0.2
  batch_size: 64
  use_species_weights: False

model:
  type: vae_multidecoder_coral
  latent_dim: 64
  num_domains: 2

training:
  epochs: 200
  lr: 1e-4
  annealing_epochs: 100
  patience: 40
  metrics_plot_title: "VAE Multidecoder CORAL"

evaluation:
  use_domain: false
  compute_tsne: true
