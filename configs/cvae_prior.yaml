experiment:
  name: cvae_species_prior
  seed: 42
  output_dir: experiments/results

data:
  domains: ["DRIAMS_A", "DRIAMS_D"]
  normalization: row_minmax
  test_size: 0.2
  batch_size: 64
  use_species_weights: False
  
model:
  type: cvae_species_prior
  latent_dim: 64
  cond_dim: 2        
  n_species: 6       

training:
  epochs: 200
  annealing_epochs: 100
  patience: 40
  metrics_plot_title: "cVAE w/prior for species"

evaluation:
  use_domain: true
  compute_tsne: true
