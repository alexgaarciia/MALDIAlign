experiment:
  name: vae_multidecoder
  seed: 42
  output_dir: experiments/results

data:
  domains: ["DRIAMS_A", "DRIAMS_D"]
  normalization: row_minmax
  test_size: 0.2
  batch_size: 64
  use_species_weights: False

model:
  type: vae_multidecoder
  latent_dim: 64
  num_domains: 2

training:
  epochs: 200
  lr: 1e-4
  annealing_epochs: 100
  patience: 40
  metrics_plot_title: "VAE Multidecoder"

evaluation:
  use_domain: false
  compute_tsne: true

classification:
  original: 
    train_domain: DRIAMS_A
    test_domains: [DRIAMS_B, DRIAMS_C, DRIAMS_D]
    val_size: 0.2
    random_forest:
      n_estimators: 200
      max_depth: 20
      class_weight: "balanced_subsample"
      n_jobs: -1 
      random_state: 42
  latent:
    train_domain: DRIAMS_A
    test_domains: [DRIAMS_D]
    val_size: 0.2
    random_forest:
      n_estimators: 800
      max_depth: 20
      class_weight: "balanced_subsample"
      n_jobs: -1 
      random_state: 42
